<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="DAVID — Full-stack developer">
  <style>
    .name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:72px;font-weight:700;fill:#eeeeee}
    .role{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:22px;fill:#808080}
    .cur{fill:#fab283;animation:bl 1.1s steps(1) infinite}
    @keyframes bl{50%{opacity:0}}
    .name,.role{opacity:0;animation:in 0.1s linear forwards}
    .role{animation-delay:2.2s}
    @keyframes in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.cur{animation:none}.name,.role{opacity:1;animation:none}}
  </style>
  <rect width="900" height="260" fill="none"/>
  <text class="name" x="40" y="130">DAVID<tspan class="cur" dx="8">_</tspan></text>
  <text class="role" x="44" y="190">Full-stack developer</text>
</svg>
