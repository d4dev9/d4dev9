<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="D4DEV — Information Systems Developer">
  <style>
    .mono {
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .window {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5;
    }

    .bar {
      fill: #161b22;
    }

    .line {
      stroke: #30363d;
      stroke-width: 1;
    }

    .prompt {
      fill: #39d353;
    }

    .cyan {
      fill: #58a6ff;
    }

    .text {
      fill: #e6edf3;
    }

    .dim {
      fill: #8b949e;
    }

    .name {
      fill: #ffffff;
      font-weight: 700;
    }

    .fade {
      opacity: 0;
      animation: appear .55s ease forwards;
    }

    .a1 {
      animation-delay: .15s;
    }

    .a2 {
      animation-delay: .45s;
    }

    .a3 {
      animation-delay: .75s;
    }

    .a4 {
      animation-delay: 1.05s;
    }

    .cursor {
      fill: #39d353;
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes appear {
      to {
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      50.01%, 100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade {
        opacity: 1;
        animation: none;
      }

      .cursor {
        animation: none;
      }
    }
  </style>

  <rect class="window" x="1.5" y="1.5" width="897" height="297" rx="10"/>

  <rect class="bar" x="1.5" y="1.5" width="897" height="42" rx="10"/>
  <rect class="bar" x="1.5" y="32" width="897" height="11"/>

  <circle cx="23" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="43" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="63" cy="22" r="6" fill="#27c93f"/>

  <text x="450" y="27" text-anchor="middle" class="mono dim" font-size="13">
    D4DEV — Developer Profile
  </text>

  <line class="line" x1="1.5" y1="43" x2="898.5" y2="43"/>

  <g class="mono">

    <text x="32" y="82" font-size="15" class="fade a1">
      <tspan class="prompt">d4dev@dev</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="cyan">~</tspan>
      <tspan class="dim">$</tspan>
      <tspan class="text"> whoami</tspan>
    </text>

    <text x="32" y="135" font-size="42" class="name fade a2">
      D4DEV
    </text>

    <text x="34" y="170" font-size="19" class="cyan fade a3">
      Information Systems Developer
    </text>

    <text x="34" y="205" font-size="15" class="dim fade a3">
      Building practical web applications.
    </text>

    <text x="32" y="253" font-size="15" class="fade a4">
      <tspan class="prompt">d4dev@dev</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="cyan">~</tspan>
      <tspan class="dim">$</tspan>
    </text>

    <rect class="cursor fade a4" x="171" y="240" width="8" height="16" rx="1"/>

  </g>
</svg>
