<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-label="D4DEV — Software Developer">
  <style>
    .mono {
      font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    .window {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5;
    }

    .bar {
      fill: #161b22;
    }

    .line {
      stroke: #30363d;
      stroke-width: 1;
    }

    .prompt {
      fill: #39d353;
    }

    .cyan {
      fill: #58a6ff;
    }

    .text {
      fill: #e6edf3;
    }

    .dim {
      fill: #8b949e;
    }

    .name {
      fill: #ffffff;
      font-weight: 700;
    }

    .green {
      fill: #3fb950;
    }

    .blue {
      fill: #58a6ff;
    }

    .purple {
      fill: #bc8cff;
    }

    .fade {
      opacity: 0;
      animation: appear .55s ease forwards;
    }

    .a1 { animation-delay: .15s; }
    .a2 { animation-delay: .40s; }
    .a3 { animation-delay: .65s; }
    .a4 { animation-delay: .90s; }
    .a5 { animation-delay: 1.15s; }
    .a6 { animation-delay: 1.40s; }

    .cursor {
      fill: #39d353;
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes appear {
      to {
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 50% {
        opacity: 1;
      }

      50.01%, 100% {
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade {
        opacity: 1;
        animation: none;
      }

      .cursor {
        animation: none;
      }
    }
  </style>

  <rect class="window" x="1.5" y="1.5" width="897" height="357" rx="10"/>

  <rect class="bar" x="1.5" y="1.5" width="897" height="42" rx="10"/>
  <rect class="bar" x="1.5" y="32" width="897" height="11"/>

  <circle cx="23" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="43" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="63" cy="22" r="6" fill="#27c93f"/>

  <text x="450" y="27" text-anchor="middle" class="mono dim" font-size="13">
    D4DEV — Developer Profile
  </text>

  <line class="line" x1="1.5" y1="43" x2="898.5" y2="43"/>

  <g class="mono">

    <text x="32" y="78" font-size="15" class="fade a1">
      <tspan class="prompt">d4dev@dev</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="cyan">~</tspan>
      <tspan class="dim">$</tspan>
      <tspan class="text"> whoami</tspan>
    </text>

    <text x="32" y="125" font-size="39" class="name fade a2">
      D4DEV
    </text>

    <text x="34" y="153" font-size="17" class="fade a3">
      <tspan class="cyan">Software Developer</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="text">Web Applications</tspan>
    </text>

    <text x="34" y="181" font-size="14.5" class="dim fade a3">
      Building practical web applications through hands-on projects.
    </text>

    <text x="32" y="220" font-size="15" class="fade a4">
      <tspan class="prompt">d4dev@dev</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="cyan">~</tspan>
      <tspan class="dim">$</tspan>
      <tspan class="text"> stack --core</tspan>
    </text>

    <text x="34" y="249" font-size="15.5" class="fade a5">
      <tspan class="green">Java</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="blue">Spring Boot</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="cyan">React</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="purple">JavaScript</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="green">PostgreSQL</tspan>
    </text>

    <text x="32" y="286" font-size="15" class="fade a5">
      <tspan class="prompt">d4dev@dev</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="cyan">~</tspan>
      <tspan class="dim">$</tspan>
      <tspan class="text"> status --learning</tspan>
    </text>

    <text x="34" y="315" font-size="15.5" class="fade a6">
      <tspan class="purple">Python</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="cyan">Vue</tspan>
      <tspan class="dim"> · </tspan>
      <tspan class="green">AI / Automation</tspan>
    </text>

    <text x="32" y="343" font-size="14" class="fade a6">
      <tspan class="prompt">d4dev@dev</tspan>
      <tspan class="dim">:</tspan>
      <tspan class="cyan">~</tspan>
      <tspan class="dim">$</tspan>
    </text>

    <rect class="cursor fade a6" x="171" y="330" width="8" height="15" rx="1"/>

  </g>
</svg>
