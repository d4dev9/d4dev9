name: repo-count-badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contar repos (públicos + privados)
        env:
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: |
          COUNT=$(gh api --paginate "/user/repos?visibility=all&affiliation=owner&per_page=100" --jq '.[].id' | wc -l)
          mkdir -p assets/badges
          echo "{\"schemaVersion\":1,\"label\":\"Repositories\",\"message\":\"$COUNT\",\"color\":\"007ec6\",\"style\":\"flat\"}" > assets/badges/badge.json

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update repositories count badge"
          file_pattern: assets/badges/badge.json
 
