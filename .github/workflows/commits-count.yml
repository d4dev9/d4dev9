name: total-commits-badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Contar commits totales
        env:
      # Usamos el token con permisos para leer repositorios privados y de usuario
          GH_TOKEN: ${{ secrets.REPO_COUNT_TOKEN }}
        run: |
          # Consulta los commits de tu usuario en todos tus repositorios
          COMMITS=$(gh api --paginate "/search/commits?q=author:d4dev9" --jq '.total_count')
          mkdir -p assets/badges
          echo "{\"schemaVersion\":1,\"label\":\"Total Commits\",\"message\":\"$COMMITS\",\"color\":\"2ea44f\",\"style\":\"flat\"}" > assets/badges/commits.json

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update total commits badge"
          file_pattern: assets/badges/commits.json
